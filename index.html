<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Matrícula - FIIS UNFV</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="login-split">
        <div class="login-left">
            <div class="login-left-content">
                <div class="logo-container" style="margin-bottom: 3rem;">
                    <img src="/assets/img/logo_unfv.png" alt="UNFV Logo" class="unfv-shield">
                </div>
                <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 700; letter-spacing: -0.5px;">SISTEMA DE MATRÍCULA</h1>
                <p style="font-size: 2.8rem; font-weight: 800; line-height: 1.2; margin-bottom: 1.5rem; color: #fff;">
                    Tu futuro<br>
                    <span style="color: #F28C28;">comienza</span> aquí
                </p>
                <p style="font-size: 1.1rem; font-weight: 600; color: rgba(255, 255, 255, 0.9);">
                    Estudia &bull; Crece &bull; Transforma
                </p>

                <!-- Bottom left branding -->
                <div style="position: absolute; bottom: 2rem; left: 2rem; display: flex; align-items: center; gap: 1rem; z-index: 2;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/>
                    </svg>
                    <div>
                        <h4 style="margin: 0; font-size: 0.9rem; font-weight: 700;">UNFV</h4>
                        <p style="margin: 0; font-size: 0.8rem; color: rgba(255,255,255,0.7);">Universidad que construye el futuro</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="login-right">
            <div class="login-card-inner">
                <div class="login-header">
                    <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F28C28" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                            <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/>
                        </svg>
                    </div>
                    <h2>Iniciar sesión</h2>
                    <p>Accede a tu cuenta para continuar</p>
                </div>
                
                <form id="login-form">
                    <div id="login-error" class="error-message" style="display: none;"></div>
                    
                    <div class="form-group">
                        <label for="codigo">Código de alumno</label>
                        <div class="input-icon-wrapper">
                            <span class="icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </span>
                            <input type="text" id="codigo" name="codigo" required placeholder="Ingresa tu código de alumno">
                        </div>
                    </div>
                    
                    <div class="form-group password-group">
                        <label for="password">Contraseña</label>
                        <div class="input-icon-wrapper">
                            <span class="icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            </span>
                            <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
                            <button type="button" id="toggle-password" class="toggle-btn" aria-label="Mostrar/ocultar contraseña">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember"><input type="checkbox"> Recordar sesión</label>
                        <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" id="btn-login" class="btn-primary">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                        <span class="btn-text">Iniciar sesión</span>
                        <span class="btn-loader" style="display: none;">Iniciando...</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="/js/login.js"></script>
</body>
</html>
